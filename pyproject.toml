[project]
name = "open-tam"
version = "0.1.0"
description = "AgentScope + MCP based SRE Agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mcp>=1.2",
    "agentscope>=1.0",
]

[project.scripts]
open-tam = "open_tam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_tam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
