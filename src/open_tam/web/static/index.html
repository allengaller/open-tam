<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-tam · SRE Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1c2330; --dim:#6b7280;
          --orch:#2563eb; --metric:#0d9488; --log:#b45309; --err:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .fault-btn { border:1px solid var(--line); background:#fff; border-radius:6px;
               padding:4px 10px; cursor:pointer; font-size:13px; }
  .fault-btn:hover { border-color:var(--orch); color:var(--orch); }
  .tab { border:0; background:none; padding:4px 10px; cursor:pointer; font-size:14px;
         color:var(--dim); border-bottom:2px solid transparent; }
  .tab.active { color:var(--orch); border-bottom-color:var(--orch); font-weight:600; }
  #user-box { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; }
  #user-box .role { color:var(--dim); font-size:12px; }
  #user-box button { border:1px solid var(--line); background:#fff; border-radius:6px;
                    padding:2px 8px; cursor:pointer; font-size:12px; }
  main { max-width:880px; margin:0 auto; padding:20px; display:flex; flex-direction:column;
         gap:12px; min-height:calc(100vh - 180px); }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px;
         padding:12px 14px; }
  .msg.user { border-left:3px solid var(--dim); }
  .msg .who { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .msg pre { margin:6px 0 0; padding:8px; background:#f1f3f5; border-radius:6px;
             overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .ev { border-left:3px solid var(--orch); }
  .ev.metric { border-left-color:var(--metric); }
  .ev.log { border-left-color:var(--log); }
  .ev.confirm { border-left-color:#d97706; }
  .ev.error, .msg.report.error { border-left-color:var(--err); }
  .ev .tool { font-family:ui-monospace,monospace; font-size:12px; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--dim); font-size:12px; }
  .msg.report { border-left:3px solid var(--orch); }
  .msg.report h3 { margin:0 0 6px; font-size:15px; }
  .msg.report .conf { font-size:12px; color:var(--dim); }
  footer { max-width:880px; margin:0 auto; padding:0 20px 20px; width:100%; }
  .composer { background:var(--card); border:1px solid var(--line); border-radius:10px;
              padding:12px; display:flex; flex-direction:column; gap:8px; }
  textarea { width:100%; min-height:110px; border:1px solid var(--line); border-radius:6px;
             padding:8px; font:12px/1.5 ui-monospace,monospace; resize:vertical; }
  .row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .row label { font-size:13px; color:var(--dim); display:flex; align-items:center; gap:4px; }
  button.send { background:var(--orch); color:#fff; border:0; border-radius:6px;
                padding:8px 18px; cursor:pointer; font-size:14px; }
  button.send:disabled { opacity:.5; cursor:not-allowed; }
  .hint { font-size:12px; color:var(--dim); }
  /* 登录遮罩 */
  #login-mask { position:fixed; inset:0; background:rgba(28,35,48,.55); display:none;
                align-items:center; justify-content:center; z-index:10; }
  #login-mask.show { display:flex; }
  .login-card { background:var(--card); border-radius:12px; padding:24px; width:320px;
                display:flex; flex-direction:column; gap:10px; }
  .login-card h2 { margin:0; font-size:16px; }
  .login-card input { border:1px solid var(--line); border-radius:6px; padding:8px;
                      font-size:13px; }
  .login-card .err { color:var(--err); font-size:12px; min-height:16px; }
  /* 历史视图 */
  #view-history { display:none; }
  .hist-item { background:var(--card); border:1px solid var(--line); border-radius:10px;
               padding:10px 14px; cursor:pointer; }
  .hist-item:hover { border-color:var(--orch); }
  .hist-item .line1 { display:flex; gap:10px; align-items:center; font-size:13px; }
  .hist-item .id { font-family:ui-monospace,monospace; color:var(--dim); font-size:12px; }
  .badge { font-size:11px; border-radius:10px; padding:1px 8px; }
  .badge.done { background:#dcfce7; color:#166534; }
  .badge.running { background:#dbeafe; color:#1e40af; }
  .badge.error { background:#fee2e2; color:#991b1b; }
  .hist-item .cause { font-size:12px; color:var(--dim); margin-top:2px;
                      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 知识库视图 */
  #view-skills { display:none; }
  .skill-item { background:var(--card); border:1px solid var(--line); border-radius:10px;
                padding:10px 14px; }
  .skill-item .line1 { display:flex; gap:10px; align-items:center; font-size:13px; }
  .skill-item .skill-name { font-weight:600; }
  .skill-item .pat { font-family:ui-monospace,monospace; color:var(--dim); font-size:12px; }
  .skill-item .del { margin-left:auto; }
  .badge.conf { background:#dbeafe; color:#1e40af; font-family:ui-monospace,monospace; }
  .skill-detail { margin-top:6px; }
  .skill-detail pre { margin:6px 0 0; padding:8px; background:#f1f3f5; border-radius:6px;
                      overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  /* 评测视图 */
  #view-evals { display:none; }
  .eval-item { background:var(--card); border:1px solid var(--line); border-radius:10px;
               padding:10px 14px; }
  .eval-item .line1 { display:flex; gap:10px; align-items:center; font-size:13px; }
  .eval-item .id { font-family:ui-monospace,monospace; color:var(--dim); font-size:12px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px;
           padding:12px 14px; }
  .panel h3 { margin:0 0 8px; font-size:14px; }
  table.cmp { border-collapse:collapse; width:100%; font-size:13px; }
  table.cmp th, table.cmp td { border:1px solid var(--line); padding:4px 8px; text-align:right; }
  table.cmp th:first-child, table.cmp td:first-child { text-align:left; }
  #cmp-box select { border:1px solid var(--line); border-radius:6px; padding:4px;
                    font-size:13px; max-width:220px; }
</style>
</head>
<body>
<header>
  <h1>open-tam · SRE Agent</h1>
  <button class="tab active" id="tab-investigate">排查台</button>
  <button class="tab" id="tab-history">排查历史</button>
  <button class="tab" id="tab-skills">知识库</button>
  <button class="tab" id="tab-evals">评测</button>
  <span id="fault-bar"><span class="hint">故障模板：</span><span id="faults"></span></span>
  <span id="user-box"></span>
</header>
<main id="view-investigate">
  <div id="timeline"></div>
</main>
<main id="view-history">
  <div class="hint" id="hist-hint">加载中…</div>
  <div id="hist-list" style="display:flex;flex-direction:column;gap:8px;"></div>
  <div id="hist-detail"></div>
</main>
<main id="view-skills">
  <div class="hint" id="skills-hint">加载中…</div>
  <div id="skills-list" style="display:flex;flex-direction:column;gap:8px;"></div>
</main>
<main id="view-evals">
  <div class="hint" id="evals-hint">加载中…</div>
  <div class="panel" id="trend-panel" style="display:none">
    <h3>命中率趋势</h3>
    <div id="eval-trend"></div>
  </div>
  <div class="panel" id="cmp-box" style="display:none">
    <h3>A/B 对比</h3>
    <div class="row">
      <select id="cmp-a"></select>
      <span class="hint">vs</span>
      <select id="cmp-b"></select>
    </div>
    <div id="cmp-table" style="margin-top:8px"></div>
  </div>
  <div id="evals-list" style="display:flex;flex-direction:column;gap:8px;"></div>
</main>
<footer id="composer-bar">
  <div class="composer">
    <textarea id="alert-json" placeholder='粘贴告警 JSON，或点上方故障模板自动填充'></textarea>
    <div class="row">
      <label><input type="checkbox" id="fake" checked> fake 演示（无 Key）</label>
      <label>transport
        <select id="transport"><option>inline</option><option>mcp</option></select>
      </label>
      <button class="send" id="send">发起排查</button>
      <span class="hint" id="status"></span>
    </div>
  </div>
</footer>
<div id="login-mask">
  <div class="login-card">
    <h2>open-tam 登录</h2>
    <div class="hint">输入 API Key（`open-tam user create` 创建时生成）</div>
    <input id="api-key-input" type="password" placeholder="ot_xxxxxxxx" autocomplete="off">
    <div class="err" id="login-err"></div>
    <button class="send" id="login-btn">登录</button>
  </div>
</div>
<script>
const timeline = document.getElementById('timeline');
const statusEl = document.getElementById('status');
const sendBtn = document.getElementById('send');
const KEY_STORAGE = 'open-tam-api-key';

const AGENT_LABEL = { undefined: 'orchestrator', metric: 'metric 子 Agent', log: 'log 子 Agent' };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function scrollBottom() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  const key = localStorage.getItem(KEY_STORAGE);
  if (key) h['X-API-Key'] = key;
  return h;
}

/* ---------- 视图切换 ---------- */
const viewInv = document.getElementById('view-investigate');
const viewHist = document.getElementById('view-history');
const viewSkills = document.getElementById('view-skills');
const viewEvals = document.getElementById('view-evals');
function showTab(name) {
  viewInv.style.display = name === 'investigate' ? 'flex' : 'none';
  viewHist.style.display = name === 'history' ? 'flex' : 'none';
  viewSkills.style.display = name === 'skills' ? 'flex' : 'none';
  viewEvals.style.display = name === 'evals' ? 'flex' : 'none';
  document.getElementById('composer-bar').style.display =
    name === 'investigate' ? 'block' : 'none';
  document.getElementById('fault-bar').style.display =
    name === 'investigate' ? 'inline' : 'none';
  for (const t of ['investigate', 'history', 'skills', 'evals']) {
    document.getElementById('tab-' + t).classList.toggle('active', name === t);
  }
  if (name === 'history') loadHistory();
  if (name === 'skills') loadSkills();
  if (name === 'evals') loadEvals();
}
document.getElementById('tab-investigate').onclick = () => showTab('investigate');
document.getElementById('tab-history').onclick = () => showTab('history');
document.getElementById('tab-skills').onclick = () => showTab('skills');
document.getElementById('tab-evals').onclick = () => showTab('evals');

/* ---------- 排查台 ---------- */
function addUserCard(alertJson) {
  const m = el('div', 'msg user');
  m.appendChild(el('div', 'who', '你 · 发起排查'));
  m.appendChild(el('pre', null, JSON.stringify(alertJson, null, 2)));
  timeline.appendChild(m); scrollBottom();
}

function addEvent(ev) {
  if (ev.kind === 'alert_received') return;
  if (ev.kind === 'done') return addReport(ev);
  if (ev.kind === 'error') return addError(ev);
  if (ev.kind === 'confirm_request') return addConfirm(ev);
  const agent = ev.agent;
  const cls = 'msg ev' + (agent ? ' ' + agent : '');
  const m = el('div', cls);
  m.appendChild(el('div', 'who', AGENT_LABEL[agent] || agent || 'orchestrator'));
  if (ev.kind === 'tool_call') {
    if (ev.thought) m.appendChild(el('div', null, ev.thought));
    m.appendChild(el('div', 'tool', '→ ' + ev.tool + ' ' + JSON.stringify(ev.arguments || {})));
  } else if (ev.kind === 'observation') {
    const d = el('details');
    d.appendChild(el('summary', null, '观察' + (ev.error ? '（工具错误）' : '')));
    d.appendChild(el('pre', null, ev.observation || ''));
    m.appendChild(d);
  } else if (ev.kind === 'final') {
    return;
  } else if (ev.kind === 'budget_exceeded') {
    m.appendChild(el('div', null, '达到步数/预算上限，转人工'));
  } else {
    m.appendChild(el('pre', null, JSON.stringify(ev)));
  }
  timeline.appendChild(m); scrollBottom();
}

function addReport(ev) {
  const m = el('div', 'msg report');
  m.appendChild(el('h3', null, '根因报告'));
  m.appendChild(el('div', null, ev.root_cause || '未定位根因'));
  if (ev.skill_used) {
    m.appendChild(el('div', 'conf', '参考了 1 条历史经验：' + ev.skill_used.name +
      '（置信度 ' + ev.skill_used.confidence.toFixed(2) + '）'));
  }
  m.appendChild(el('div', 'conf', '置信度：' + (ev.confidence || '—') + '　报告：' + (ev.report_path || '—')));
  if (ev.evidence && ev.evidence.length) {
    const d = el('details'); d.appendChild(el('summary', null, '证据（' + ev.evidence.length + '）'));
    d.appendChild(el('pre', null, ev.evidence.join('\n'))); m.appendChild(d);
  }
  if (ev.actions && ev.actions.length) {
    const d = el('details'); d.appendChild(el('summary', null, '建议动作（' + ev.actions.length + '）'));
    d.appendChild(el('pre', null, ev.actions.join('\n'))); m.appendChild(d);
  }
  timeline.appendChild(m); scrollBottom();
  finish('排查完成');
}

function addError(ev) {
  const m = el('div', 'msg report error');
  m.appendChild(el('h3', null, '排查失败'));
  m.appendChild(el('pre', null, ev.error || 'unknown error'));
  timeline.appendChild(m); scrollBottom();
  finish('排查失败');
}

function finish(text) {
  statusEl.textContent = text;
  sendBtn.disabled = false;
}

/* ---------- 敏感操作人工确认（M7-B） ---------- */
let currentInvId = null;

function addConfirm(ev) {
  const m = el('div', 'msg ev confirm');
  m.appendChild(el('div', 'who', '待人工确认 · 敏感操作'));
  m.appendChild(el('div', null, 'Agent 请求执行敏感操作：' + ev.action));
  m.appendChild(el('pre', null, JSON.stringify(ev.arguments, null, 2)));
  const row = el('div', 'row');
  const yes = el('button', 'send', '批准执行');
  const no = el('button', 'fault-btn', '拒绝');
  yes.onclick = () => decide(ev.request_id, true, yes, no);
  no.onclick = () => decide(ev.request_id, false, yes, no);
  row.appendChild(yes); row.appendChild(no);
  m.appendChild(row);
  timeline.appendChild(m); scrollBottom();
}

async function decide(requestId, approved, yes, no) {
  yes.disabled = true; no.disabled = true;
  const r = await fetch('/api/investigations/' + currentInvId + '/confirm', {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ request_id: requestId, approved }),
  });
  const res = el('div', 'who', r.ok
    ? (approved ? '已批准，继续执行' : '已拒绝，操作未执行')
    : (r.status === 409 ? '裁决失败：确认已过期或已被处理（超时将视为拒绝）'
                        : '裁决失败：' + r.status));
  yes.parentElement.appendChild(res); scrollBottom();
}

async function loadFaults() {
  const r = await fetch('/api/faults', { headers: authHeaders() });
  if (r.status === 401) { showLogin(); return false; }
  const { faults } = await r.json();
  const box = document.getElementById('faults');
  box.innerHTML = '';
  for (const f of faults) {
    const b = el('button', 'fault-btn', f.name);
    b.title = f.anomaly_desc;
    b.onclick = () => selectFault(f);
    box.appendChild(b);
  }
  return true;
}

async function selectFault(f) {
  await fetch('/api/faults/' + f.name + '/activate',
              { method: 'POST', headers: authHeaders() });
  document.getElementById('alert-json').value = JSON.stringify({
    alert_name: f.name + ' 告警', service: f.service, metric: f.metric,
    threshold: 80, current_value: 92.5,
  }, null, 2);
  statusEl.textContent = '已注入故障 ' + f.name + '，告警 JSON 已预填';
}

/* fetch 流式读 SSE（EventSource 无法带 X-API-Key 头） */
async function streamEvents(id) {
  const r = await fetch('/api/investigations/' + id + '/events', { headers: authHeaders() });
  if (!r.ok || !r.body) { finish('事件流连接失败：' + r.status); return; }
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      for (const line of chunk.split('\n')) {
        if (line.startsWith('data:')) addEvent(JSON.parse(line.slice(5).trim()));
      }
    }
  }
}

sendBtn.onclick = async () => {
  let alert;
  try { alert = JSON.parse(document.getElementById('alert-json').value); }
  catch { statusEl.textContent = '告警 JSON 解析失败'; return; }
  sendBtn.disabled = true;
  statusEl.textContent = '排查中…';
  addUserCard(alert);
  const r = await fetch('/api/investigations', {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({
      alert, fake: document.getElementById('fake').checked,
      transport: document.getElementById('transport').value,
    }),
  });
  if (r.status === 401) { finish('未认证'); showLogin(); return; }
  if (r.status === 403) { finish('当前角色无排查权限'); return; }
  if (!r.ok) {
    statusEl.textContent = '发起失败：' + r.status + ' ' + (await r.text());
    sendBtn.disabled = false;
    return;
  }
  const { id } = await r.json();
  currentInvId = id;
  await streamEvents(id);
};

/* ---------- 排查历史 ---------- */
async function loadHistory() {
  const hint = document.getElementById('hist-hint');
  const list = document.getElementById('hist-list');
  const detail = document.getElementById('hist-detail');
  detail.innerHTML = '';
  const r = await fetch('/api/history', { headers: authHeaders() });
  if (r.status === 401) { showLogin(); return; }
  if (!r.ok) { hint.textContent = '历史加载失败：' + r.status; return; }
  const { investigations } = await r.json();
  list.innerHTML = '';
  if (!investigations.length) { hint.textContent = '（暂无排查记录）'; return; }
  hint.textContent = '';
  for (const inv of investigations) {
    const item = el('div', 'hist-item');
    const line1 = el('div', 'line1');
    line1.appendChild(el('span', 'badge ' + inv.status, inv.status));
    line1.appendChild(el('span', 'id', inv.id.slice(0, 12) + '…'));
    line1.appendChild(el('span', null, inv.alert_id));
    line1.appendChild(el('span', 'hint', (inv.created_at || '').slice(0, 19).replace('T', ' ')));
    item.appendChild(line1);
    item.appendChild(el('div', 'cause', inv.root_cause || '（未定位根因）'));
    item.onclick = () => showHistoryDetail(inv.id);
    list.appendChild(item);
  }
}

async function showHistoryDetail(id) {
  const detail = document.getElementById('hist-detail');
  const r = await fetch('/api/history/' + id, { headers: authHeaders() });
  if (!r.ok) { detail.textContent = '详情加载失败：' + r.status; return; }
  const inv = await r.json();
  detail.innerHTML = '';
  const m = el('div', 'msg report');
  m.appendChild(el('h3', null, '排查详情 · ' + inv.id));
  m.appendChild(el('div', null, '状态：' + inv.status + '　告警：' + inv.alert_id));
  m.appendChild(el('div', null, inv.root_cause || '未定位根因'));
  m.appendChild(el('div', 'conf',
    '置信度：' + (inv.confidence || '—') +
    '　报告：' + (inv.report_path || '—') +
    '　trace：' + (inv.trace_path || '—')));
  detail.appendChild(m);
  detail.scrollIntoView({ behavior: 'smooth' });
}

/* ---------- 知识库 ---------- */
async function loadSkills() {
  const hint = document.getElementById('skills-hint');
  const list = document.getElementById('skills-list');
  const r = await fetch('/api/skills', { headers: authHeaders() });
  if (r.status === 401) { showLogin(); return; }
  if (!r.ok) { hint.textContent = '知识库加载失败：' + r.status; return; }
  const { skills } = await r.json();
  list.innerHTML = '';
  if (!skills.length) {
    hint.textContent = '（知识库为空。用 `open-tam skill learn --traces traces/` 从排查历史提取）';
    return;
  }
  hint.textContent = '共 ' + skills.length + ' 条经验（按置信度降序）：';
  for (const s of skills) list.appendChild(renderSkill(s));
}

function renderSkill(s) {
  const item = el('div', 'skill-item');
  const line1 = el('div', 'line1');
  line1.appendChild(el('span', 'skill-name', s.name));
  line1.appendChild(el('span', 'badge conf', s.confidence.toFixed(2)));
  line1.appendChild(el('span', 'pat', s.alert_pattern + ' · ' + s.service_pattern));
  const del = el('button', 'fault-btn del', '删除');
  del.onclick = async () => {
    if (!window.confirm('删除 Skill「' + s.name + '」？')) return;
    const r = await fetch('/api/skills/' + s.id,
                          { method: 'DELETE', headers: authHeaders() });
    if (r.status === 403) { item.appendChild(el('div', 'hint', '当前角色无 manage_skills 权限')); return; }
    if (!r.ok) { item.appendChild(el('div', 'hint', '删除失败：' + r.status)); return; }
    item.remove();
  };
  line1.appendChild(del);
  item.appendChild(line1);
  if (s.description) item.appendChild(el('div', 'cause', s.description));
  const d = el('details', 'skill-detail');
  d.appendChild(el('summary', null, '详情'));
  const body = el('pre', null, '加载中…');
  d.appendChild(body);
  d.addEventListener('toggle', async () => {
    if (!d.open || body.dataset.loaded) return;
    const r = await fetch('/api/skills/' + s.id, { headers: authHeaders() });
    body.textContent = r.ok
      ? JSON.stringify(await r.json(), null, 2)
      : '详情加载失败：' + r.status;
    body.dataset.loaded = '1';
  });
  item.appendChild(d);
  return item;
}

/* ---------- 评测 ---------- */
const CMP_METRICS = [
  ['根因定位率', 'located_rate', v => (v * 100).toFixed(0) + '%'],
  ['关键词命中率', 'hit_rate', v => (v * 100).toFixed(0) + '%'],
  ['平均步数', 'avg_steps', v => v.toFixed(1)],
  ['平均耗时(s)', 'avg_elapsed_s', v => v.toFixed(2)],
  ['证据充分性', 'avg_evidence_sufficiency', v => v.toFixed(2)],
];

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function loadEvals() {
  const hint = document.getElementById('evals-hint');
  const list = document.getElementById('evals-list');
  const r = await fetch('/api/evals', { headers: authHeaders() });
  if (r.status === 401) { showLogin(); return; }
  if (!r.ok) { hint.textContent = '评测加载失败：' + r.status; return; }
  const { evals } = await r.json();
  list.innerHTML = '';
  if (!evals.length) {
    hint.textContent = '（暂无评测记录。用 `open-tam eval --fake` 跑一次评测）';
    document.getElementById('trend-panel').style.display = 'none';
    document.getElementById('cmp-box').style.display = 'none';
    return;
  }
  hint.textContent = '共 ' + evals.length + ' 次评测（按时间降序）：';
  document.getElementById('trend-panel').style.display = 'block';
  document.getElementById('eval-trend').innerHTML = renderTrend(evals);
  setupCompare(evals);
  for (const ev of evals) list.appendChild(renderEvalItem(ev));
}

function renderTrend(evals) {
  const data = [...evals].reverse();
  const W = 760, H = 150, P = 34;
  const xs = i => P + i * (W - 2 * P) / (data.length - 1);
  const ys = v => H - P - v * (H - 2 * P);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="命中率趋势">`;
  for (const v of [0, 0.5, 1]) {
    svg += `<line x1="${P}" y1="${ys(v)}" x2="${W - P}" y2="${ys(v)}" stroke="#e3e6ea"/>`;
    svg += `<text x="${P - 6}" y="${ys(v) + 4}" font-size="10" fill="#6b7280" text-anchor="end">${v * 100}%</text>`;
  }
  svg += `<polyline points="${data.map((e, i) => `${xs(i)},${ys(e.hit_rate)}`).join(' ')}"
           fill="none" stroke="#2563eb" stroke-width="2"/>`;
  data.forEach((e, i) => {
    svg += `<circle cx="${xs(i)}" cy="${ys(e.hit_rate)}" r="3.5" fill="#2563eb"><title>` +
      `${esc(e.model_label)} · ${Math.round(e.hit_rate * 100)}%</title></circle>`;
  });
  return svg + '</svg>';
}

function setupCompare(evals) {
  const box = document.getElementById('cmp-box');
  const sa = document.getElementById('cmp-a');
  const sb = document.getElementById('cmp-b');
  box.style.display = 'block';
  for (const s of [sa, sb]) {
    s.innerHTML = '';
    for (const ev of evals) {
      const o = document.createElement('option');
      o.value = ev.id;
      o.textContent = `${ev.created_at.slice(0, 16).replace('T', ' ')} ${ev.model_label}（${Math.round(ev.hit_rate * 100)}%）`;
      s.appendChild(o);
    }
    s.onchange = renderCompare;
  }
  if (evals.length >= 2) sb.selectedIndex = 1;
  renderCompare();
}

async function renderCompare() {
  const a = document.getElementById('cmp-a').value;
  const b = document.getElementById('cmp-b').value;
  const table = document.getElementById('cmp-table');
  if (!a || !b || a === b) { table.innerHTML = ''; return; }
  const fetchOne = id => fetch('/api/evals/' + id, { headers: authHeaders() }).then(r => r.json());
  const [ra, rb] = await Promise.all([fetchOne(a), fetchOne(b)]);
  let html = '<table class="cmp"><tr><th>指标</th><th>A</th><th>B</th><th>差异</th></tr>';
  for (const [label, key, fmt] of CMP_METRICS) {
    const va = ra[key], vb = rb[key];
    const diff = vb - va;
    const diffStr = fmt(va) === fmt(vb) ? '—'
      : (diff > 0 ? '+' : '−') + fmt(Math.abs(diff));
    html += `<tr><td>${label}</td><td>${fmt(va)}</td><td>${fmt(vb)}</td><td>${diffStr}</td></tr>`;
  }
  html += '</table>';
  table.innerHTML = html;
}

function renderEvalItem(ev) {
  const item = el('div', 'eval-item');
  const line1 = el('div', 'line1');
  line1.appendChild(el('span', 'badge conf', (ev.hit_rate * 100).toFixed(0) + '%'));
  line1.appendChild(el('span', 'id', ev.id));
  line1.appendChild(el('span', null, ev.model_label));
  line1.appendChild(el('span', 'hint',
    `${ev.total} 样本 · 步数 ${ev.avg_steps.toFixed(1)} · ${(ev.created_at || '').slice(0, 19).replace('T', ' ')}`));
  item.appendChild(line1);
  const d = el('details', 'skill-detail');
  d.appendChild(el('summary', null, '详情'));
  const body = el('pre', null, '加载中…');
  d.appendChild(body);
  d.addEventListener('toggle', async () => {
    if (!d.open || body.dataset.loaded) return;
    const r = await fetch('/api/evals/' + ev.id, { headers: authHeaders() });
    if (!r.ok) { body.textContent = '详情加载失败：' + r.status; return; }
    const detail = await r.json();
    const lines = detail.runs.map(x =>
      `${x.keyword_hit ? '✓' : '✗'} ${x.fault} · 步数 ${x.steps} · ${x.elapsed_s.toFixed(1)}s · 证据 ${x.evidence_sufficiency?.toFixed(2)} — ${x.root_cause || '未定位'}`);
    body.textContent = lines.join('\n') + `\n\n报告：${detail.report_path || '—'}`;
    body.dataset.loaded = '1';
  });
  item.appendChild(d);
  return item;
}

/* ---------- 登录 ---------- */
function showLogin() {
  document.getElementById('login-mask').classList.add('show');
  document.getElementById('api-key-input').focus();
}
async function tryLogin() {
  const key = document.getElementById('api-key-input').value.trim();
  const errEl = document.getElementById('login-err');
  if (!key) { errEl.textContent = '请输入 API Key'; return; }
  const r = await fetch('/api/me', { headers: { 'X-API-Key': key } });
  if (!r.ok) { errEl.textContent = '认证失败：' + r.status; return; }
  const me = await r.json();
  if (!me.authenticated) { errEl.textContent = 'Key 无效'; return; }
  localStorage.setItem(KEY_STORAGE, key);
  document.getElementById('login-mask').classList.remove('show');
  errEl.textContent = '';
  renderUser(me);
  loadFaults();
}
document.getElementById('login-btn').onclick = tryLogin;
document.getElementById('api-key-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryLogin();
});

async function renderUser() {
  const box = document.getElementById('user-box');
  const key = localStorage.getItem(KEY_STORAGE);
  if (!key) { box.innerHTML = ''; return; }
  const r = await fetch('/api/me', { headers: { 'X-API-Key': key } });
  if (!r.ok) { box.innerHTML = ''; return; }
  const me = await r.json();
  if (!me.authenticated) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  box.appendChild(el('span', null, me.username));
  box.appendChild(el('span', 'role', me.role));
  const out = el('button', null, '退出');
  out.onclick = () => { localStorage.removeItem(KEY_STORAGE); location.reload(); };
  box.appendChild(out);
}

/* ---------- 启动 ---------- */
(async () => {
  const ok = await loadFaults();
  if (ok) renderUser();
})();
</script>
